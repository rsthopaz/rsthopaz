name: generate monkeytype readme svg

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  download-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download SVG
        run: |
          mkdir -p public

          curl -L -o public/monkeytype-readme.svg \
          https://monkeytype-readme.zeabur.app/generate-svg/Tezt/nord_light

          curl -L -o public/monkeytype-readme-lb.svg \
          "https://monkeytype-readme.zeabur.app/generate-svg/Tezt/nord_light?lb=true"

          curl -L -o public/monkeytype-readme-pb.svg \
          "https://monkeytype-readme.zeabur.app/generate-svg/Tezt/nord_light?pb=true"

      - name: Push SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: monkeytype-readme
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
